apiVersion: v1
kind: Service
metadata:
  name: lab2-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab2-jaeger.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "lab2-jaeger.selectorLabels" . | nindent 4 }}
  ports:
    - name: query-http
      port: 16686
      targetPort: query-http
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
