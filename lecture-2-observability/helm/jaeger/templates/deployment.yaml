apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab2-jaeger.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Each instance has its own memory store. Avoid split trace histories on upgrade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lab2-jaeger.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab2-jaeger.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/jaeger/config.yaml"]
          env:
            - name: GOMEMLIMIT
              value: {{ .Values.goMemoryLimit | quote }}
          ports:
            - name: query-http
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: 8888
          startupProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: lab2-jaeger
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
