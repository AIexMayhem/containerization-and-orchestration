apiVersion: v1
kind: ConfigMap
metadata:
  name: lab2-jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab2-jaeger.labels" . | nindent 4 }}
data:
  config.yaml: |
    extensions:
      healthcheckv2:
        use_v2: true
        component_health:
          include_permanent_errors: true
        http:
          endpoint: 0.0.0.0:13133
          status:
            enabled: true
            path: /status
          config:
            enabled: false
      jaeger_storage:
        backends:
          lab:
            memory:
              max_traces: {{ .Values.storage.maxTraces }}
      jaeger_query:
        storage:
          traces: lab
        http:
          endpoint: 0.0.0.0:16686
        enable_tracing: false
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: {{ .Values.memoryLimiter.limitMiB }}
        spike_limit_mib: {{ .Values.memoryLimiter.spikeLimitMiB }}
      batch:
        timeout: 1s
        send_batch_size: 256
        send_batch_max_size: 512
    exporters:
      jaeger_storage_exporter:
        trace_storage: lab
    service:
      extensions: [healthcheckv2, jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: lab2-jaeger
        logs:
          level: info
          encoding: json
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
