apiVersion: v1
kind: Service
metadata:
  name: lab2-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: lab2-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app: lab2-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
