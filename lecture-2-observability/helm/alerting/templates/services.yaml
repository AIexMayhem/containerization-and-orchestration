apiVersion: v1
kind: Service
metadata:
  name: lab2-karma
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lab2-karma
    {{- include "lab2-alerting.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lab2-karma
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lab2-alert-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lab2-alert-receiver
    {{- include "lab2-alerting.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lab2-alert-receiver
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
