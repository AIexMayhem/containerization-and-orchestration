apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-alert-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lab2-alert-receiver
    {{- include "lab2-alerting.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lab2-alert-receiver
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab2-alert-receiver
        {{- include "lab2-alerting.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/receiver-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: "{{ .Values.receiver.image.repository }}:{{ .Values.receiver.image.tag }}"
          imagePullPolicy: {{ .Values.receiver.image.pullPolicy }}
          command: ["python", "/receiver/receiver.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: HISTORY_LIMIT
              value: {{ .Values.receiver.historyLimit | quote }}
            - name: MAX_BODY_BYTES
              value: {{ .Values.receiver.maxBodyBytes | quote }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.receiver.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: receiver
              mountPath: /receiver
              readOnly: true
      volumes:
        - name: receiver
          configMap:
            name: lab2-alert-receiver
