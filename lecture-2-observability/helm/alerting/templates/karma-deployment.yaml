apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2-karma
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lab2-karma
    {{- include "lab2-alerting.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab2-karma
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab2-karma
        {{- include "lab2-alerting.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/karma-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: karma
          image: "{{ .Values.karma.image.repository }}:{{ .Values.karma.image.tag }}"
          imagePullPolicy: {{ .Values.karma.image.pullPolicy }}
          args: ["--config.file=/etc/karma/karma.yaml"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.karma.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/karma
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lab2-karma
