apiVersion: v1
kind: ConfigMap
metadata:
  name: lab2-karma
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lab2-karma
    {{- include "lab2-alerting.labels" . | nindent 4 }}
data:
  karma.yaml: |
    alertmanager:
      interval: 10s
      servers:
        - name: {{ .Values.karma.alertmanager.name | quote }}
          uri: {{ .Values.karma.alertmanager.uri | quote }}
          timeout: 10s
          proxy: true
    listen:
      address: 0.0.0.0
      port: 8080
    log:
      level: info
      format: json
    history:
      enabled: false
