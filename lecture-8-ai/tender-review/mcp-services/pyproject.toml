[project]
name = "tender-mcp-services"
version = "0.1.0"
description = "Read-only MCP sources for the tender precheck teaching lab"
requires-python = ">=3.11"
dependencies = [
    "httpx2==2.16.0",
    "mcp==2.3.0",
    "prometheus-client==0.26.0",
    "pydantic==2.14.2",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
